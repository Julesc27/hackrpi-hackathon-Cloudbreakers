# Railway config-as-code for the frontend service.
# In Railway: Settings > Source > Root Directory = /frontend
#             Settings > Config-as-code > Railway Config File = /frontend/railway.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
