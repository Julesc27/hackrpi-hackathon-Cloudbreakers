services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # keep container's node_modules separate from your machine's
    environment:
      - CHOKIDAR_USEPOLLING=true   # reliable hot reload on Windows bind mounts
      - VITE_API_URL=http://localhost:8000   # the browser calls the backend on your machine

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload   # dev only; Dockerfile CMD is prod
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - path: ./backend/.env   # Atlas creds (git-ignored); see backend/.env.example
        required: false        # so the frontend still runs for teammates without it
    environment:
      - WATCHFILES_FORCE_POLLING=true   # reliable hot reload on Windows bind mounts
      - ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173   # either dev URL can log in
