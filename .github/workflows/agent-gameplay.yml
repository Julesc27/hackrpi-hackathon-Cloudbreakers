name: Agent gameplay - gather wood

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-play:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Check agent harness and grader
        working-directory: frontend
        run: node --test agent-tests/agent.test.mjs
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Evaluate browser agent
        working-directory: frontend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional repo variable; empty falls back to defaultModel in agent-tests/agent.mjs.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo 'Set the GEMINI_API_KEY repository secret before running this workflow.' >&2
            exit 1
          fi
          # Scenario ids live in agent-tests/scenarios.mjs.
          npx playwright test --config agent-tests/playwright.config.js --grep "\[gather-wood\]"
      - name: Upload transcript and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-gather-wood-evidence
          path: frontend/agent-results/
          if-no-files-found: ignore
