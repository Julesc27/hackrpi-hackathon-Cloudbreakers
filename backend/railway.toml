# Railway config-as-code for the backend service.
# In Railway: Settings > Source > Root Directory = /backend
#             Settings > Config-as-code > Railway Config File = /backend/railway.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
