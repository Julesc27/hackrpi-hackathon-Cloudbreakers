# Production stack for the VM. Local dev uses ../docker-compose.yml instead.
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# Needs backend/.env on the server (MONGODB_URI, MONGODB_DB, JWT_SECRET). Never committed.

services:
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_API_URL: https://api.${SITE_DOMAIN:-cloudbreakers.club}
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-cloudbreakers.club}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach the deploy hook on the host
    volumes:
      - caddy_data:/data      # certificates; keep across redeploys to avoid Let's Encrypt rate limits
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ../backend
    env_file: ../backend/.env
    environment:
      - ALLOWED_ORIGINS=https://${SITE_DOMAIN:-cloudbreakers.club},https://www.${SITE_DOMAIN:-cloudbreakers.club}
    # not published: only Caddy talks to it
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
